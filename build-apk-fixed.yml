name: Build SawtChat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract SawtChat project
        run: |
          unzip -q sawtchat_ready_phone.zip -d package

      - name: Prepare Android project
        working-directory: package/flutter
        run: |
          flutter create --platforms=android --org com.sawtchat .
          flutter pub get

      - name: Build APK
        working-directory: package/flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SawtChat-APK
          path: package/flutter/build/app/outputs/flutter-apk/app-release.apk
